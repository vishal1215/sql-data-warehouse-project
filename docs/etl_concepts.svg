<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ETL and Data Warehouse Concepts</title>
  <desc>Source systems flow through file parsing into an ETL process (Extract, Transform, Load), which feeds a data warehouse covering modeling, slowly changing dimensions, and audit logging.</desc>
  <rect width="1100" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ================= connectors (drawn first, under nodes) ================= -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none">
    <path d="M130,315 L130,352"/>                          <!-- source -> file parsing -->
    <path d="M185,260 L435,260" marker-end="url(#arrow)"/>  <!-- source -> etl -->
    <path d="M565,260 L825,260" marker-end="url(#arrow)"/>  <!-- etl -> warehouse -->

    <path d="M455,205 L385,130"/>   <!-- etl -> extract -->
    <path d="M500,195 L500,105"/>   <!-- etl -> transform -->
    <path d="M545,205 L615,130"/>   <!-- etl -> load -->

    <path d="M845,315 L765,395"/>   <!-- warehouse -> modeling -->
    <path d="M890,325 L890,432"/>   <!-- warehouse -> scd -->
    <path d="M935,315 L1015,395"/>  <!-- warehouse -> audit -->
  </g>

  <!-- ================= SOURCE hub ================= -->
  <circle cx="130" cy="260" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="130" y="255" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">SOURCE</text>
  <text x="130" y="272" font-size="10" fill="#1e40af" text-anchor="middle">CRM / ERP</text>

  <rect x="55" y="352" width="150" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="380" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">File Parsing</text>

  <!-- ================= ETL hub ================= -->
  <circle cx="500" cy="260" r="65" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="255" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">ETL</text>
  <text x="500" y="273" font-size="9.5" fill="#166534" text-anchor="middle">Extract · Transform · Load</text>

  <rect x="315" y="88" width="140" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="385" y="116" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">Extract</text>

  <rect x="430" y="58" width="140" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="86" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">Transform</text>

  <rect x="545" y="88" width="140" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="116" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">Load</text>

  <!-- ================= DATA WAREHOUSE hub ================= -->
  <circle cx="890" cy="260" r="65" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="890" y="252" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="middle">DATA</text>
  <text x="890" y="270" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="middle">WAREHOUSE</text>

  <rect x="690" y="395" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="765" y="423" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle">Modeling</text>

  <rect x="815" y="432" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="890" y="456" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle">SCD (Type 1 / 2)</text>

  <rect x="940" y="395" width="150" height="46" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1015" y="423" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle">Audit Logs</text>

  <text x="550" y="530" font-size="11" fill="#94a3b8" text-anchor="middle">ETL &amp; data warehouse concepts</text>
</svg>
