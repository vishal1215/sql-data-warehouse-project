<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Data Warehouse Architecture</title>
  <desc>CRM and ERP CSV sources flow through Bronze, Silver, and Gold layers into ad-hoc SQL and BI/reporting consumers.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="478" rx="16" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- column headers -->
  <text x="152" y="52" font-size="13" font-weight="700" letter-spacing="0.5" fill="#475569" text-anchor="middle">SOURCES</text>
  <text x="376" y="52" font-size="13" font-weight="700" letter-spacing="0.5" fill="#c2670c" text-anchor="middle">BRONZE</text>
  <text x="600" y="52" font-size="13" font-weight="700" letter-spacing="0.5" fill="#475569" text-anchor="middle">SILVER</text>
  <text x="824" y="52" font-size="13" font-weight="700" letter-spacing="0.5" fill="#a16207" text-anchor="middle">GOLD</text>
  <text x="1048" y="52" font-size="13" font-weight="700" letter-spacing="0.5" fill="#475569" text-anchor="middle">CONSUME</text>
  <rect x="106" y="62" width="92" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="330" y="62" width="92" height="3" rx="1.5" fill="#d97706"/>
  <rect x="554" y="62" width="92" height="3" rx="1.5" fill="#64748b"/>
  <rect x="778" y="62" width="92" height="3" rx="1.5" fill="#ca8a04"/>
  <rect x="1002" y="62" width="92" height="3" rx="1.5" fill="#94a3b8"/>

  <!-- ===================== SOURCES (two stacked cards) ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="67" y="130" width="170" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="67" y="130" width="4" height="70" rx="2" fill="#94a3b8"/>
  <g transform="translate(83,144)" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 1h9l5 5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 19V2.5A1.5 1.5 0 0 1 2 1z"/>
    <path d="M11 1v5h5"/>
    <path d="M4.5 13h9M4.5 16.5h6"/>
  </g>
  <text x="112" y="163" font-size="12.5" font-weight="600" fill="#1e293b">CRM CSVs</text>
  <text x="112" y="180" font-size="10.5" fill="#94a3b8">cust · prd · sales</text>

  <g filter="url(#cardShadow)">
    <rect x="67" y="220" width="170" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="67" y="220" width="4" height="70" rx="2" fill="#94a3b8"/>
  <g transform="translate(83,234)" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 1h9l5 5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 19V2.5A1.5 1.5 0 0 1 2 1z"/>
    <path d="M11 1v5h5"/>
    <path d="M4.5 13h9M4.5 16.5h6"/>
  </g>
  <text x="112" y="253" font-size="12.5" font-weight="600" fill="#1e293b">ERP CSVs</text>
  <text x="112" y="270" font-size="10.5" fill="#94a3b8">cust · loc · category</text>

  <!-- ===================== BRONZE ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="291" y="150" width="170" height="130" rx="14" fill="#fffaf3" stroke="#f3d0a3"/>
  </g>
  <rect x="291" y="150" width="170" height="6" rx="3" fill="#d97706"/>
  <circle cx="376" cy="192" r="20" fill="#fef3e2" stroke="#f0c47f"/>
  <g transform="translate(365,181)" stroke="#c2670c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="22" height="6" rx="1.6"/>
    <rect x="0" y="8.5" width="22" height="6" rx="1.6"/>
    <rect x="0" y="17" width="22" height="6" rx="1.6"/>
  </g>
  <text x="376" y="233" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">Bronze Layer</text>
  <text x="376" y="251" font-size="10.5" fill="#a16621" text-anchor="middle">raw tables, as-is</text>
  <text x="376" y="266" font-size="9.5" font-family="'SF Mono', Consolas, monospace" fill="#c2670c" text-anchor="middle">BULK INSERT · reload</text>

  <!-- ===================== SILVER ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="515" y="150" width="170" height="130" rx="14" fill="#f8fafc" stroke="#dbe3ec"/>
  </g>
  <rect x="515" y="150" width="170" height="6" rx="3" fill="#64748b"/>
  <circle cx="600" cy="192" r="20" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g transform="translate(590,181)" stroke="#475569" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1h18l-7 9v7l-4 2v-9z"/>
  </g>
  <text x="600" y="233" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Silver Layer</text>
  <text x="600" y="251" font-size="10.5" fill="#64748b" text-anchor="middle">cleansed, standardized</text>
  <text x="600" y="266" font-size="9.5" font-family="'SF Mono', Consolas, monospace" fill="#475569" text-anchor="middle">dedup · normalize · derive</text>

  <!-- ===================== GOLD ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="739" y="150" width="170" height="130" rx="14" fill="#fffdf0" stroke="#efe0a3"/>
  </g>
  <rect x="739" y="150" width="170" height="6" rx="3" fill="#ca8a04"/>
  <circle cx="824" cy="192" r="20" fill="#fef9c3" stroke="#eddb84"/>
  <g transform="translate(812,180)" fill="#a16207">
    <path d="M12 0l3.09 6.26L22 7.27l-5 4.87 1.18 6.86L12 15.9l-6.18 3.1L7 12.14 2 7.27l6.91-1.01z"/>
  </g>
  <text x="824" y="233" font-size="13.5" font-weight="700" fill="#854d0e" text-anchor="middle">Gold Layer</text>
  <text x="824" y="251" font-size="10.5" fill="#a16621" text-anchor="middle">star schema, views</text>
  <text x="824" y="266" font-size="9.5" font-family="'SF Mono', Consolas, monospace" fill="#a16207" text-anchor="middle">business-ready · no load</text>

  <!-- ===================== CONSUME (two stacked cards) ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="963" y="130" width="170" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="963" y="130" width="4" height="70" rx="2" fill="#94a3b8"/>
  <g transform="translate(979,145)" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10l4-4 3 3 6-6"/>
    <path d="M12 3h4v4"/>
  </g>
  <text x="1008" y="163" font-size="12.5" font-weight="600" fill="#1e293b">Ad-hoc SQL</text>
  <text x="1008" y="180" font-size="10.5" fill="#94a3b8">analysis scripts</text>

  <g filter="url(#cardShadow)">
    <rect x="963" y="220" width="170" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="963" y="220" width="4" height="70" rx="2" fill="#94a3b8"/>
  <g transform="translate(979,234)" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="10" width="4" height="8" rx="1" fill="#64748b" stroke="none"/>
    <rect x="7" y="5" width="4" height="13" rx="1" fill="#64748b" stroke="none"/>
    <rect x="14" y="0" width="4" height="18" rx="1" fill="#64748b" stroke="none"/>
  </g>
  <text x="1008" y="253" font-size="12.5" font-weight="600" fill="#1e293b">BI / Reporting</text>
  <text x="1008" y="270" font-size="10.5" fill="#94a3b8">dashboards</text>

  <!-- ===================== connectors ===================== -->
  <g stroke="url(#arrowGrad)" stroke-width="2" fill="none" marker-end="url(#arrowHead)">
    <path d="M237,165 C 260,165 268,192 291,192"/>
    <path d="M237,255 C 260,255 268,215 291,215"/>
    <path d="M461,215 L515,215"/>
    <path d="M685,215 L739,215"/>
    <path d="M909,200 C 932,200 940,165 963,165"/>
    <path d="M909,230 C 932,230 940,255 963,255"/>
  </g>

  <text x="600" y="342" font-size="11" fill="#94a3b8" text-anchor="middle">Medallion architecture — sql-data-warehouse-project</text>
</svg>
